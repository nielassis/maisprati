<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <title>Lista de compras</title>
  </head>
  <body>
    <main>
      <section id="todo-form-container">
        <h1 class="todo-title">Lista de Compras</h1>

        <div class="todo-controllers">
          <span class="total-count">Items: </span>
          <span class="purchased-count">Comprados: </span>
          <span class="pending-count">Pendentes: </span>

          <div class="todo-order-filter">
            <select name="filter" id="filter">
              <option value="all">Todos</option>
              <option value="purchased">Comprados</option>
              <option value="pending">Pendentes</option>
            </select>

            <select name="order" id="order">
              <option value="default">Padrão</option>
              <option value="alphabetical">Alfabeticamente</option>
              <option value="status">Status</option>
            </select>
          </div>
        </div>

        <div class="todo-add-container">
          <form id="todo-form">
            <div class="form-inputs">
              <input
                type="text"
                class="input-name"
                placeholder="Nome do item"
                id="todo-input-form"
              />
            </div>
            <div class="form-buttons">
              <button class="todo-add-btn" type="submit">Adicionar</button>
              <button class="todo-clear-btn" type="button">Limpar lista</button>
            </div>
          </form>
        </div>
      </section>

      <section id="todo-items">
        <ul id="items-list"></ul>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
