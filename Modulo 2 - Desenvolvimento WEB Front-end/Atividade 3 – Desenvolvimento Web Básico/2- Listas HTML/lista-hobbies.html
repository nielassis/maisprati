<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-hobbies.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

  <body>

      <p>Aqui vai uma lista dos meus hobbies</p>

          <li class="card">

          <li class="card"><i class="bi bi-book"></i><span>Estudar</span></li>

          <li class="card">
            <i class="bi bi-tv"></i><span>Assistir Animes/Séries</span>
          </li>
          <li class="card">
            <i class="bi bi-music-note"></i><span>Ouvir música</span>
          </li>

        <div>
          <a href="lista-receitas.html">Veja minha lista de receitas</a>
