<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria Soulslike</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Galeria de Jogos Soulslike</h1>
      <p>Explore os títulos mais icônicos do gênero Soulslike</p>
    </header>

    <main>
      <section class="galeria-container">
        <h2>Jogos em Destaque</h2>
        <div class="galeria">
          <figure>
            <img src="assets/elden-ring.png" alt="Elden Ring" />
            <figcaption>Elden Ring</figcaption>
          </figure>
          <figure>
            <img src="assets/dark-souls.png" alt="Dark Souls" />
            <figcaption>Dark Souls Remastered</figcaption>
          </figure>
          <figure>
            <img src="assets/dark-souls-2.png" alt="Dark Souls II" />
            <figcaption>Dark Souls II: Scholar of the First Sin</figcaption>
          </figure>
          <figure>
            <img src="assets/dark-souls-3.png" alt="Dark Souls III" />
            <figcaption>Dark Souls III</figcaption>
          </figure>
          <figure>
            <img src="assets/bloodborne.png" alt="Bloodborne" />
            <figcaption>Bloodborne</figcaption>
          </figure>
          <figure>
            <img src="assets/sekiro.png" alt="Sekiro" />
            <figcaption>Sekiro: Shadows Die Twice</figcaption>
          </figure>
          <figure>
            <img src="assets/demon-souls.png" alt="Demon Souls" />
            <figcaption>Demon Souls</figcaption>
          </figure>
          <figure>
            <img src="assets/lies-of-p.png" alt="Lies of P" />
            <figcaption>Lies of P</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2025 Galeria Soulslike. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
